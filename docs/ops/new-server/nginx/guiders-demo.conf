# Demo pixel — https://guiders-demo.__DOMAIN__
# Web de prueba del SDK. El visitante habla con Nest vía api.__DOMAIN__.

server {
    listen 80;
    listen [::]:80;
    server_name guiders-demo.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guiders-demo.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/guiders-demo.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guiders-demo.__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guiders-demo;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

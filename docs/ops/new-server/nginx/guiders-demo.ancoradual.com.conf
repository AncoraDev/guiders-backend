# Demo pixel — https://guiders-demo.ancoradual.com
# Copia de guiders-sdk/demo/app (PHP). El visitante habla con Nest vía guiders-api.

server {
    listen 80;
    listen [::]:80;
    server_name guiders-demo.ancoradual.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/guiders-demo;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

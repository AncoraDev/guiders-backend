# Admin SPA — https://admin.__DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name admin.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/admin.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guiders-frontend/current/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
